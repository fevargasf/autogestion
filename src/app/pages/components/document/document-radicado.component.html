
<div class="container mt-5">
  <div class="row">
    <div class="col-md-12">
      <mat-card class="mat-card-confirmacion-envio">
        <p>¡Se ha enviado con éxito a nuestros registros!</p>
        <p>Muchas gracias por tu gestión. Se ha enviado con éxito los documentos con radicado <b>{{radicado?.radicado}}</b> . Te
          recomendamos estar pendiente del correo electronico registrado para podernos comunicar contigo.</p>
      </mat-card>
    </div>
  </div>
</div>

<div class="buttons">
    <button class="offset"><a [href]="pdfUrl | domSeguro" download="Documento.pdf">Descargar Radicado</a></button>
</div>
  <div class="col-md-12" *ngIf="pdfUrl">
    <app-output-document [pdfSrc]="pdfUrl"></app-output-document> 
  </div>
<div class="button-group">
  <button class="offset" routerLink="/">Gestionar otra autegestión</button>
  <button class="offset" src="https://sirena.corantioquia.gov.co/lago/CtrlIniciarApp">Salir</button>
    
</div>
